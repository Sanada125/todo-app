<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234a90d9'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>✓</text></svg>">
<title>ToDo - タスク管理</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* ===== CSS Variables ===== */
:root {
  --primary: #6c5ce7;
  --primary-dark: #5a4bd1;
  --primary-glow: rgba(108,92,231,0.3);
  --accent: #00cec9;
  --danger: #ff6b6b;
  --danger-glow: rgba(255,107,107,0.2);
  --warning: #feca57;
  --success: #00b894;
  --success-glow: rgba(0,184,148,0.2);
  --gray: #a4b0be;
  --gray-light: rgba(164,176,190,0.1);
  --gray-dark: #636e72;
  --bg: #0f0f23;
  --bg-secondary: #1a1a35;
  --card-bg: rgba(30,30,60,0.8);
  --card-bg-solid: #1e1e3c;
  --card-hover: rgba(40,40,80,0.9);
  --text: #e2e8f0;
  --text-light: #a0aec0;
  --text-bright: #ffffff;
  --border: rgba(255,255,255,0.08);
  --border-light: rgba(255,255,255,0.05);
  --priority-high: #ff6b6b;
  --priority-mid: #feca57;
  --priority-low: #a4b0be;
  --urgency-overdue: #ff6b6b;
  --urgency-today: #ff6b6b;
  --urgency-soon3: #fd9644;
  --urgency-soon7: #feca57;
  --gcal-bg: rgba(66,133,244,0.1);
  --gcal-border: #4285f4;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
  --glass: blur(20px) saturate(180%);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(108,92,231,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(0,206,201,0.06) 0%, transparent 50%);
  background-attachment: fixed;
}
button { cursor: pointer; font: inherit; border: none; background: none; }
input, select, textarea { font: inherit; color: var(--text); }

/* ===== Header ===== */
.header {
  background: rgba(15,15,35,0.85);
  -webkit-backdrop-filter: var(--glass);
  backdrop-filter: var(--glass);
  color: var(--text-bright);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 20px;
  font-weight: 800;
  flex: 1;
  letter-spacing: 1px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.06);
  color: var(--text);
  font-size: 18px;
  transition: all 0.25s ease;
  border: 1px solid var(--border);
}
.header-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.15);
  transform: translateY(-1px);
}
.header-btn.gcal-connected {
  background: var(--success-glow);
  border-color: var(--success);
  box-shadow: 0 0 12px var(--success-glow);
}

/* ===== Filter Bar ===== */
.filter-bar {
  background: rgba(15,15,35,0.6);
  -webkit-backdrop-filter: var(--glass);
  backdrop-filter: var(--glass);
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.filter-toggle {
  display: none;
  width: 100%;
  padding: 10px;
  background: rgba(255,255,255,0.04);
  border-radius: var(--radius-sm);
  text-align: center;
  color: var(--text-light);
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.filter-toggle:hover { background: rgba(255,255,255,0.08); }
.filter-controls { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.filter-select {
  flex: 1;
  min-width: 100px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.04);
  font-size: 13px;
  color: var(--text);
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.filter-select:focus { outline: none; border-color: var(--primary); }
.filter-select option { background: var(--card-bg-solid); color: var(--text); }
.sort-group {
  display: flex;
  gap: 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border);
}
.sort-btn {
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 500;
  background: rgba(255,255,255,0.04);
  color: var(--text-light);
  transition: all 0.25s;
}
.sort-btn.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 0 12px var(--primary-glow);
}

/* ===== Main Content ===== */
.main { max-width: 720px; margin: 0 auto; padding: 16px 16px 100px; }

/* ===== Task Card ===== */
.task-card {
  background: var(--card-bg);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  border-left: 4px solid transparent;
  transition: all 0.25s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.task-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.02) 0%, transparent 100%);
  pointer-events: none;
}
.task-card:hover {
  background: var(--card-hover);
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
  border-color: rgba(255,255,255,0.12);
}
.task-card:active { transform: scale(0.98) translateY(0); }
.task-card.urgency-overdue { border-left-color: var(--urgency-overdue); box-shadow: var(--shadow), inset 0 0 20px var(--danger-glow); }
.task-card.urgency-today { border-left-color: var(--urgency-today); box-shadow: var(--shadow), inset 0 0 20px var(--danger-glow); }
.task-card.urgency-soon3 { border-left-color: var(--urgency-soon3); }
.task-card.urgency-soon7 { border-left-color: var(--urgency-soon7); }
.task-card.gcal-event {
  background: var(--gcal-bg);
  border-left-color: var(--gcal-border);
  border: 1px solid rgba(66,133,244,0.2);
  border-left: 4px solid var(--gcal-border);
}

.task-checkbox {
  width: 24px; height: 24px;
  border: 2px solid var(--gray);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-size: 13px;
  color: transparent;
}
.task-checkbox:hover { border-color: var(--primary); box-shadow: 0 0 8px var(--primary-glow); }
.task-checkbox.checked {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
  box-shadow: 0 0 10px var(--success-glow);
  animation: checkPop 0.3s ease;
}
@keyframes checkPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
.gcal-icon {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  font-size: 17px;
}

.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 15px; font-weight: 600; word-break: break-word; color: var(--text-bright); }
.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 5px;
  font-size: 12px;
  color: var(--text-light);
  align-items: center;
}
.task-category {
  background: rgba(108,92,231,0.15);
  color: #b8b0f0;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid rgba(108,92,231,0.2);
}
.task-memo-preview {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0.7;
}
.task-recurring-icon { font-size: 13px; color: var(--accent); }

.task-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
  flex-shrink: 0;
}
.task-deadline {
  font-size: 12px;
  color: var(--text-light);
  white-space: nowrap;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.task-deadline.overdue { color: var(--danger); font-weight: 700; }
.task-deadline.today { color: var(--danger); font-weight: 700; }
.priority-badge {
  font-size: 10px;
  padding: 2px 10px;
  border-radius: 20px;
  color: #fff;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.priority-badge.high { background: linear-gradient(135deg, #ff6b6b, #ee5a24); box-shadow: 0 2px 8px rgba(255,107,107,0.3); }
.priority-badge.mid { background: linear-gradient(135deg, #feca57, #f0932b); color: #1a1a2e; box-shadow: 0 2px 8px rgba(254,202,87,0.3); }
.priority-badge.low { background: rgba(164,176,190,0.2); color: var(--text-light); border: 1px solid rgba(164,176,190,0.2); box-shadow: none; }

/* ===== Completed Section ===== */
.completed-section {
  margin-top: 32px;
}
.completed-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  cursor: pointer;
  user-select: none;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.completed-header .arrow { transition: transform 0.3s ease; font-size: 12px; }
.completed-header .arrow.open { transform: rotate(90deg); }
.completed-list .task-card { opacity: 0.45; }
.completed-list .task-card:hover { opacity: 0.65; }
.completed-list .task-title { text-decoration: line-through; text-decoration-color: var(--text-light); }

/* ===== Empty State ===== */
.empty-state {
  text-align: center;
  padding: 64px 16px;
  color: var(--text-light);
}
.empty-state .icon { font-size: 56px; margin-bottom: 16px; opacity: 0.6; }
.empty-state p { font-size: 15px; opacity: 0.8; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}
.modal-overlay.active { opacity: 1; visibility: visible; }
.modal {
  background: var(--bg-secondary);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  border-radius: 20px 20px 0 0;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid var(--border);
  border-bottom: none;
}
.modal-overlay.active .modal { transform: translateY(0); }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-secondary);
  z-index: 1;
}
.modal-header h2 { font-size: 17px; font-weight: 700; color: var(--text-bright); }
.modal-close {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  color: var(--text-light);
  transition: all 0.2s;
}
.modal-close:hover { background: rgba(255,255,255,0.08); }

.modal-body { padding: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-light);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  background: rgba(255,255,255,0.04);
  color: var(--text);
  transition: all 0.2s;
}
.form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
.form-input::placeholder { color: var(--gray-dark); }
textarea.form-input { resize: vertical; min-height: 72px; }
select.form-input option { background: var(--card-bg-solid); color: var(--text); }

.priority-group { display: flex; gap: 8px; }
.priority-option {
  flex: 1;
  padding: 10px;
  text-align: center;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  transition: all 0.25s;
  color: var(--text-light);
}
.priority-option:hover { border-color: rgba(255,255,255,0.15); }
.priority-option.selected { color: #fff; }
.priority-option[data-value="high"].selected { background: var(--priority-high); border-color: var(--priority-high); box-shadow: 0 0 12px rgba(255,107,107,0.3); }
.priority-option[data-value="mid"].selected { background: var(--priority-mid); border-color: var(--priority-mid); color: #1a1a2e; box-shadow: 0 0 12px rgba(254,202,87,0.3); }
.priority-option[data-value="low"].selected { background: rgba(164,176,190,0.3); border-color: var(--priority-low); }

.recurring-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
.recurring-type-group { display: flex; gap: 8px; margin-bottom: 10px; }
.recurring-option {
  flex: 1;
  padding: 8px;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-light);
  transition: all 0.25s;
}
.recurring-option:hover { border-color: rgba(255,255,255,0.15); }
.recurring-option.selected { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 12px var(--primary-glow); }

.dow-group { display: flex; gap: 6px; flex-wrap: wrap; }
.dow-btn {
  width: 38px; height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-light);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s;
}
.dow-btn:hover { border-color: rgba(255,255,255,0.15); }
.dow-btn.selected { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 8px var(--primary-glow); }

.modal-actions {
  display: flex;
  gap: 10px;
  padding: 18px 20px;
  border-top: 1px solid var(--border);
}
.btn {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  transition: all 0.25s;
  letter-spacing: 0.3px;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(135deg, var(--primary), #8b7cf0); color: #fff; box-shadow: 0 4px 16px var(--primary-glow); }
.btn-secondary { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: linear-gradient(135deg, var(--danger), #ee5a24); color: #fff; box-shadow: 0 4px 16px var(--danger-glow); }

.category-row {
  display: flex; gap: 10px; align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.category-row input {
  flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
  background: rgba(255,255,255,0.04); color: var(--text);
}
.category-row input:focus { outline: none; border-color: var(--primary); }
.category-delete { color: var(--danger); font-size: 20px; padding: 4px 8px; transition: transform 0.2s; }
.category-delete:hover { transform: scale(1.15); }
.category-add-row { display: flex; gap: 8px; margin-top: 14px; }
.category-add-row input {
  flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
  background: rgba(255,255,255,0.04); color: var(--text);
}
.category-add-row input:focus { outline: none; border-color: var(--primary); }
.category-add-row button {
  padding: 10px 18px; background: linear-gradient(135deg, var(--primary), #8b7cf0); color: #fff; border-radius: 8px; font-weight: 700;
  box-shadow: 0 2px 8px var(--primary-glow);
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: rgba(30,30,60,0.95);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  color: var(--text-bright);
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 500;
  z-index: 300;
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Gcal detail ===== */
.gcal-to-task-btn {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--primary), #8b7cf0);
  color: #fff;
  font-weight: 600;
  white-space: nowrap;
  transition: all 0.2s;
  box-shadow: 0 2px 8px var(--primary-glow);
}
.gcal-to-task-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--primary-glow); }

.gcal-detail-row { margin-bottom: 12px; }
.gcal-detail-row .label { font-size: 11px; color: var(--text-light); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.gcal-detail-row .value { font-size: 14px; margin-top: 3px; color: var(--text-bright); }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

/* ===== Responsive ===== */
@media (max-width: 599px) {
  .filter-toggle { display: block; }
  .filter-controls { display: none; }
  .filter-controls.open { display: flex; }
  .modal { max-width: 100%; border-radius: 20px 20px 0 0; }
}
@media (min-width: 600px) {
  .modal-overlay { align-items: center; }
  .modal { border-radius: 20px; max-height: 85vh; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <h1>ToDo</h1>
  <button class="header-btn" id="btnGcal" title="Googleカレンダー連携" onclick="GCal.handleAuth()">📅</button>
  <button class="header-btn" id="btnAdd" title="新規タスク" onclick="UI.openTaskModal()">＋</button>
  <button class="header-btn" id="btnSettings" title="カテゴリ管理" onclick="UI.openCategoryPanel()">⚙</button>
</header>

<!-- Filter Bar -->
<div class="filter-bar">
  <div class="filter-toggle" id="filterToggle" onclick="UI.toggleFilter()">フィルタ・並び替え ▼</div>
  <div class="filter-controls" id="filterControls">
    <select class="filter-select" id="filterCategory" onchange="App.render()"><option value="">すべてのカテゴリ</option></select>
    <select class="filter-select" id="filterPriority" onchange="App.render()">
      <option value="">すべての優先度</option>
      <option value="high">高</option>
      <option value="mid">中</option>
      <option value="low">低</option>
    </select>
    <div class="sort-group">
      <button class="sort-btn active" data-sort="deadline" onclick="App.setSort('deadline')">期限順</button>
      <button class="sort-btn" data-sort="priority" onclick="App.setSort('priority')">優先度順</button>
    </div>
  </div>
</div>

<!-- Main -->
<main class="main" id="mainContent"></main>

<!-- Task Modal -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="taskModalTitle">新規タスク</h2>
      <button class="modal-close" onclick="UI.closeTaskModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>タイトル *</label>
        <input type="text" class="form-input" id="formTitle" placeholder="タスク名を入力">
      </div>
      <div class="form-group">
        <label>期限</label>

            <button class="dow-btn" data-dow="3" onclick="UI.setDow(3)">水</button>
            <button class="dow-btn" data-dow="4" onclick="UI.setDow(4)">木</button>
            <button class="dow-btn" data-dow="5" onclick="UI.setDow(5)">金</button>
            <button class="dow-btn" data-dow="6" onclick="UI.setDow(6)">土</button>
          </div>
        </div>
        <div id="recurringMonthly" style="display:none">
          <label style="font-size:12px;color:var(--text-light);margin-bottom:4px;display:block;">日を指定（1〜31）</label>
          <input type="number" class="form-input" id="formDayOfMonth" min="1" max="31" value="1" style="width:100px;">

      <button class="btn btn-secondary" onclick="UI.closeTaskModal()">キャンセル</button>
      <button class="btn btn-danger" id="btnDeleteTask" style="display:none" onclick="App.deleteTask()">削除</button>

<div class="modal-overlay" id="gcalDetailModal">
  <div class="modal">
    <div class="modal-header">
      <h2>カレンダー予定</h2>
      <button class="modal-close" onclick="UI.closeGcalDetail()">×</button>
    </div>
    <div class="modal-body" id="gcalDetailBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Configuration - Google Calendar API
   ============================================================ */
const GCAL_CLIENT_ID = '604438050315-p1gvplvga9mc8nj57e575kumu8uo7vr8.apps.googleusercontent.com';
const GCAL_SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';

/* ============================================================
   Storage Layer
   ============================================================ */
const Storage = {
  _get(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch { return fallback; }
  },
  loadTasks() { return this._get('todo_tasks', []); },
  saveTasks(tasks) { localStorage.setItem('todo_tasks', JSON.stringify(tasks)); },
  loadCategories() { return this._get('todo_categories', []); },
  saveCategories(cats) { localStorage.setItem('todo_categories', JSON.stringify(cats)); },
  loadGcalEvents() { return this._get('todo_gcal_events', []); },
  saveGcalEvents(events) { localStorage.setItem('todo_gcal_events', JSON.stringify(events)); },
  loadGcalToken() { return this._get('todo_gcal_token', null); },
  saveGcalToken(token) { localStorage.setItem('todo_gcal_token', JSON.stringify(token)); },
  clearGcalToken() { localStorage.removeItem('todo_gcal_token'); },
  generateId() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }
};

/* ============================================================
   Deadline Helper
   ============================================================ */
const DeadlineHelper = {
  getUrgency(dateStr) {
    if (!dateStr) return 'none';
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(dateStr + 'T00:00:00'); d.setHours(0,0,0,0);
    const diff = Math.floor((d - today) / 86400000);
    if (diff < 0) return 'overdue';
    if (diff === 0) return 'today';
    if (diff <= 3) return 'soon3';
    if (diff <= 7) return 'soon7';
    return 'normal';
  },
  formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getMonth()+1}/${d.getDate()}`;
  },
  formatDateFull(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr + 'T00:00:00');
    const dow = ['日','月','火','水','木','金','土'][d.getDay()];
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} (${dow})`;
  }
};

/* ============================================================
   Recurring Helper
   ============================================================ */
const RecurringHelper = {
  calcNextDeadline(task) {
    const base = task.deadline ? new Date(task.deadline + 'T00:00:00') : new Date();
    base.setHours(0,0,0,0);
    const r = task.recurring;
    if (r.type === 'daily') {
      base.setDate(base.getDate() + 1);
    } else if (r.type === 'weekly') {
      const target = r.dayOfWeek;
      let d = new Date(base);
      d.setDate(d.getDate() + 1);
      while (d.getDay() !== target) d.setDate(d.getDate() + 1);
      return this._toDateStr(d);
    } else if (r.type === 'monthly') {
      let y = base.getFullYear(), m = base.getMonth() + 1;
      if (m > 11) { m = 0; y++; } // fix: month is 0-indexed for Date
      const target = r.dayOfMonth;
      const lastDay = new Date(y, m + 1, 0).getDate();
      const day = Math.min(target, lastDay);
      return `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    }
    return this._toDateStr(base);
  },
  _toDateStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  },
  generateNext(task) {
    return {
      id: Storage.generateId(),
      title: task.title,
      memo: task.memo,
      deadline: this.calcNextDeadline(task),
      priority: task.priority,
      category: task.category,
      status: 'undone',
      completedAt: null,
      recurring: { ...task.recurring },
      createdAt: new Date().toISOString()
    };
  }
};

/* ============================================================
   Google Calendar
   ============================================================ */
const GCal = {
  tokenClient: null,
  accessToken: null,

  init() {
    if (GCAL_CLIENT_ID === 'YOUR_CLIENT_ID_HERE') return;
    if (typeof google === 'undefined' || !google.accounts) {
      setTimeout(() => GCal.init(), 500);
      return;
    }
    this.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GCAL_CLIENT_ID,
      scope: GCAL_SCOPES,
      callback: (resp) => {
        if (resp.error) return;
        this.accessToken = resp.access_token;
        Storage.saveGcalToken({ access_token: resp.access_token, expires: Date.now() + resp.expires_in * 1000 });
        document.getElementById('btnGcal').classList.add('gcal-connected');
        this.fetchEvents();
        UI.showToast('カレンダー連携しました');
      }
    });
    const saved = Storage.loadGcalToken();
    if (saved && saved.expires > Date.now()) {
      this.accessToken = saved.access_token;
      document.getElementById('btnGcal').classList.add('gcal-connected');
      this.fetchEvents();
    }
  },

  handleAuth() {
    if (GCAL_CLIENT_ID === 'YOUR_CLIENT_ID_HERE') {
      UI.showToast('クライアントIDを設定してください');
      return;
    }
    if (this.accessToken) {
      this.fetchEvents();
      UI.showToast('カレンダーを更新しました');
    } else if (this.tokenClient) {
      this.tokenClient.requestAccessToken();
    }
  },

  async fetchEvents() {
    if (!this.accessToken) return;
    const now = new Date();
    const min = now.toISOString();
    const max = new Date(now.getTime() + 7 * 86400000).toISOString();
    try {
      const res = await fetch(
        `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(min)}&timeMax=${encodeURIComponent(max)}&singleEvents=true&orderBy=startTime&maxResults=50`,
        { headers: { Authorization: `Bearer ${this.accessToken}` } }
      );
      if (res.status === 401) {
        this.accessToken = null;
        Storage.clearGcalToken();
        document.getElementById('btnGcal').classList.remove('gcal-connected');
        UI.showToast('認証が切れました。再連携してください');
        return;
      }
      const data = await res.json();
      const events = (data.items || []).map(e => ({
        id: 'gcal_' + e.id,
        title: e.summary || '(タイトルなし)',
        start: e.start.dateTime || e.start.date,
        end: e.end.dateTime || e.end.date,
        location: e.location || '',
        description: e.description || '',
        isAllDay: !!e.start.date
      }));
      Storage.saveGcalEvents(events);
      App.render();
    } catch (e) {
      const cached = Storage.loadGcalEvents();
      if (cached.length) App.render();
    }
  }
};

/* ============================================================
   App State & Logic
   ============================================================ */
const App = {
  tasks: [],
  categories: [],
  editingTaskId: null,
  currentSort: 'deadline',

  init() {
    this.tasks = Storage.loadTasks();
    this.categories = Storage.loadCategories();
    this.purgeOldCompleted();
    this.render();
    this.updateCategorySelects();
    GCal.init();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  },

  purgeOldCompleted() {
    const now = Date.now();
    const SEVEN_DAYS = 7 * 86400000;
    const before = this.tasks.length;
    this.tasks = this.tasks.filter(t => {
      if (t.status === 'done' && t.completedAt) {
        return (now - new Date(t.completedAt).getTime()) < SEVEN_DAYS;
      }
      return true;
    });
    if (this.tasks.length !== before) Storage.saveTasks(this.tasks);
  },

  setSort(sort) {
    this.currentSort = sort;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === sort));
    this.render();
  },

  getFilteredTasks() {
    const cat = document.getElementById('filterCategory').value;
    const pri = document.getElementById('filterPriority').value;
    let tasks = this.tasks.filter(t => t.status === 'undone');
    if (cat) tasks = tasks.filter(t => t.category === cat);
    if (pri) tasks = tasks.filter(t => t.priority === pri);
    return this.sortTasks(tasks);
  },

  getCompletedTasks() {
    return this.tasks.filter(t => t.status === 'done').sort((a, b) => {
      return new Date(b.completedAt) - new Date(a.completedAt);
    });
  },

  sortTasks(tasks) {
    const priOrder = { high: 0, mid: 1, low: 2 };
    if (this.currentSort === 'priority') {
      return tasks.sort((a, b) => priOrder[a.priority] - priOrder[b.priority]);
    }
    return tasks.sort((a, b) => {
      if (!a.deadline && !b.deadline) return 0;
      if (!a.deadline) return 1;
      if (!b.deadline) return -1;
      return a.deadline.localeCompare(b.deadline);
    });
  },

  render() {
    const main = document.getElementById('mainContent');
    const active = this.getFilteredTasks();
    const completed = this.getCompletedTasks();
    const gcalEvents = Storage.loadGcalEvents();

    let html = '';

    // Merge active tasks + gcal events by date
    const allItems = [];
    active.forEach(t => allItems.push({ type: 'task', data: t }));
    gcalEvents.forEach(e => {
      const startDate = e.start.includes('T') ? e.start.split('T')[0] : e.start;
      allItems.push({ type: 'gcal', data: e, sortDate: startDate });
    });

    if (this.currentSort === 'deadline') {
      allItems.sort((a, b) => {
        const da = a.type === 'task' ? (a.data.deadline || '9999-99-99') : a.sortDate;
        const db = b.type === 'task' ? (b.data.deadline || '9999-99-99') : b.sortDate;
        return da.localeCompare(db);
      });
    }

    if (allItems.length === 0) {
      html += '<div class="empty-state"><div class="icon">✨</div><p>タスクはありません</p></div>';
    } else {
      allItems.forEach(item => {
        if (item.type === 'task') {
          html += this.renderTaskCard(item.data);
        } else {
          html += this.renderGcalCard(item.data);
        }
      });
    }

    // Completed section
    if (completed.length > 0) {
      html += `<div class="completed-section">
        <div class="completed-header" onclick="UI.toggleCompleted()">
          <span class="arrow" id="completedArrow">▶</span>
          <span>完了済み (${completed.length}件)</span>
          <span style="font-size:11px;color:var(--text-light);margin-left:auto;">完了から7日後に自動削除</span>
        </div>
        <div class="completed-list" id="completedList" style="display:none">
          ${completed.map(t => this.renderTaskCard(t, true)).join('')}
        </div>
      </div>`;
    }

    main.innerHTML = html;
  },

  renderTaskCard(task, isCompleted = false) {
    const urgency = isCompleted ? '' : DeadlineHelper.getUrgency(task.deadline);
    const urgencyClass = urgency && urgency !== 'normal' && urgency !== 'none' ? ` urgency-${urgency}` : '';
    const deadlineClass = (urgency === 'overdue' ? ' overdue' : urgency === 'today' ? ' today' : '');
    const deadlineText = task.deadline ? DeadlineHelper.formatDate(task.deadline) : '';
    const priLabel = { high: '高', mid: '中', low: '低' }[task.priority];
    const recurIcon = task.recurring ? '<span class="task-recurring-icon">🔁</span>' : '';

    return `<div class="task-card${urgencyClass}" onclick="UI.openTaskModal('${task.id}')">
      <div class="task-checkbox${isCompleted ? ' checked' : ''}" onclick="event.stopPropagation();App.toggleTask('${task.id}')">✓</div>
      <div class="task-body">
        <div class="task-title">${this.esc(task.title)} ${recurIcon}</div>
        <div class="task-meta">
          ${task.category ? `<span class="task-category">${this.esc(task.category)}</span>` : ''}
          ${isCompleted && task.completedAt ? `<span>完了: ${new Date(task.completedAt).toLocaleDateString('ja-JP')}</span>` : ''}
        </div>
        ${task.memo ? `<div class="task-memo-preview">${this.esc(task.memo)}</div>` : ''}
      </div>
      <div class="task-right">
        ${deadlineText ? `<span class="task-deadline${deadlineClass}">${deadlineText}</span>` : ''}
        <span class="priority-badge ${task.priority}">${priLabel}</span>
      </div>
    </div>`;
  },

  renderGcalCard(event) {
    let timeStr = '';
    if (event.isAllDay) {
      timeStr = '終日';
    } else {
      const start = new Date(event.start);
      timeStr = `${start.getHours()}:${String(start.getMinutes()).padStart(2,'0')}`;
    }
    const dateStr = event.start.includes('T') ? event.start.split('T')[0] : event.start;

    return `<div class="task-card gcal-event" onclick="UI.openGcalDetail('${this.esc(event.id)}')">
      <div class="gcal-icon">📅</div>
      <div class="task-body">
        <div class="task-title">${this.esc(event.title)}</div>
        <div class="task-meta">
          <span class="task-category" style="background:#d4e5fc;color:#1a73e8;">カレンダー</span>
          ${event.location ? `<span>📍 ${this.esc(event.location)}</span>` : ''}
        </div>
      </div>
      <div class="task-right">
        <span class="task-deadline">${DeadlineHelper.formatDate(dateStr)}</span>
        <span style="font-size:12px;color:var(--gcal-border);font-weight:600;">${timeStr}</span>
        <button class="gcal-to-task-btn" onclick="event.stopPropagation();App.gcalToTask('${this.esc(event.id)}')">+ タスク化</button>
      </div>
    </div>`;
  },

  toggleTask(id) {
    const task = this.tasks.find(t => t.id === id);
    if (!task) return;
    if (task.status === 'undone') {
      task.status = 'done';
      task.completedAt = new Date().toISOString();
      if (task.recurring) {
        const next = RecurringHelper.generateNext(task);
        this.tasks.push(next);
        UI.showToast('次の繰り返しタスクを作成しました');
      }
    } else {
      task.status = 'undone';
      task.completedAt = null;
    }
    Storage.saveTasks(this.tasks);
    this.render();
  },

  submitTask() {
    const title = document.getElementById('formTitle').value.trim();
    if (!title) { UI.showToast('タイトルを入力してください'); return; }

    const deadline = document.getElementById('formDeadline').value || null;
    const priority = document.querySelector('.priority-option.selected')?.dataset.value || 'mid';
    const category = document.getElementById('formCategory').value;
    const memo = document.getElementById('formMemo').value.trim();

    let recurring = null;
    const recType = document.querySelector('.recurring-option.selected[data-rec]')?.dataset.rec;
    if (recType && recType !== 'none') {
      recurring = { type: recType, dayOfWeek: null, dayOfMonth: null };
      if (recType === 'weekly') {
        const sel = document.querySelector('.dow-btn.selected');
        recurring.dayOfWeek = sel ? parseInt(sel.dataset.dow) : 1;
      } else if (recType === 'monthly') {
        recurring.dayOfMonth = parseInt(document.getElementById('formDayOfMonth').value) || 1;
      }
    }

    if (this.editingTaskId) {
      const task = this.tasks.find(t => t.id === this.editingTaskId);
      if (task) {
        task.title = title; task.deadline = deadline; task.priority = priority;
        task.category = category; task.memo = memo; task.recurring = recurring;
      }
      UI.showToast('タスクを更新しました');
    } else {
      this.tasks.push({
        id: Storage.generateId(), title, memo, deadline, priority, category,
        status: 'undone', completedAt: null, recurring, createdAt: new Date().toISOString()
      });
      UI.showToast('タスクを追加しました');
    }

    Storage.saveTasks(this.tasks);
    UI.closeTaskModal();
    this.render();
  },

  deleteTask() {
    if (!this.editingTaskId) return;
    if (!confirm('このタスクを削除しますか？')) return;
    this.tasks = this.tasks.filter(t => t.id !== this.editingTaskId);
    Storage.saveTasks(this.tasks);
    UI.closeTaskModal();
    this.render();
    UI.showToast('タスクを削除しました');
  },

  addCategory() {
    const input = document.getElementById('newCategoryInput');
    const name = input.value.trim();
    if (!name) return;
    if (this.categories.includes(name)) { UI.showToast('同じ名前のカテゴリがあります'); return; }
    this.categories.push(name);
    Storage.saveCategories(this.categories);
    input.value = '';
    UI.renderCategoryList();
    this.updateCategorySelects();
    UI.showToast('カテゴリを追加しました');
  },

  updateCategory(index, newName) {
    const old = this.categories[index];
    this.categories[index] = newName;
    this.tasks.forEach(t => { if (t.category === old) t.category = newName; });
    Storage.saveCategories(this.categories);
    Storage.saveTasks(this.tasks);
    this.updateCategorySelects();
  },

  deleteCategory(index) {
    const name = this.categories[index];
    if (!confirm(`「${name}」を削除しますか？\nタスクのカテゴリは空になります。`)) return;
    this.tasks.forEach(t => { if (t.category === name) t.category = ''; });
    this.categories.splice(index, 1);
    Storage.saveCategories(this.categories);
    Storage.saveTasks(this.tasks);
    UI.renderCategoryList();
    this.updateCategorySelects();
    this.render();
  },

  updateCategorySelects() {
    const opts = '<option value="">なし</option>' + this.categories.map(c => `<option value="${this.esc(c)}">${this.esc(c)}</option>`).join('');
    document.getElementById('formCategory').innerHTML = opts;
    const filterOpts = '<option value="">すべてのカテゴリ</option>' + this.categories.map(c => `<option value="${this.esc(c)}">${this.esc(c)}</option>`).join('');
    document.getElementById('filterCategory').innerHTML = filterOpts;
  },

  gcalToTask(eventId) {
    const events = Storage.loadGcalEvents();
    const event = events.find(e => e.id === eventId);
    if (!event) return;
    const dateStr = event.start.includes('T') ? event.start.split('T')[0] : event.start;
    let memo = '';
    if (event.location) memo += '場所: ' + event.location + '\n';
    if (event.description) memo += event.description;
    this.tasks.push({
      id: Storage.generateId(),
      title: event.title,
      memo: memo.trim(),
      deadline: dateStr,
      priority: 'mid',
      category: '',
      status: 'undone',
      completedAt: null,
      recurring: null,
      createdAt: new Date().toISOString()
    });
    Storage.saveTasks(this.tasks);
    this.render();
    UI.showToast('タスクに追加しました');
  },

  esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
};

/* ============================================================
   UI
   ============================================================ */
const UI = {
  openTaskModal(taskId) {
    const modal = document.getElementById('taskModal');
    const titleEl = document.getElementById('taskModalTitle');
    const deleteBtn = document.getElementById('btnDeleteTask');

    // Reset form
    document.getElementById('formTitle').value = '';
    document.getElementById('formDeadline').value = '';
    document.getElementById('formMemo').value = '';
    document.getElementById('formCategory').value = '';
    this.setPriority('mid');
    this.setRecurring('none');

    if (taskId) {
      const task = App.tasks.find(t => t.id === taskId);
      if (!task) return;
      App.editingTaskId = taskId;
      titleEl.textContent = 'タスクを編集';
      deleteBtn.style.display = '';
      document.getElementById('formTitle').value = task.title;
      document.getElementById('formDeadline').value = task.deadline || '';
      document.getElementById('formMemo').value = task.memo;
      document.getElementById('formCategory').value = task.category;
      this.setPriority(task.priority);
      if (task.recurring) {
        this.setRecurring(task.recurring.type);
        if (task.recurring.type === 'weekly' && task.recurring.dayOfWeek !== null) {
          this.setDow(task.recurring.dayOfWeek);
        }
        if (task.recurring.type === 'monthly' && task.recurring.dayOfMonth !== null) {
          document.getElementById('formDayOfMonth').value = task.recurring.dayOfMonth;
        }
      }
    } else {
      App.editingTaskId = null;
      titleEl.textContent = '新規タスク';
      deleteBtn.style.display = 'none';
    }

    modal.classList.add('active');
  },

  closeTaskModal() {
    document.getElementById('taskModal').classList.remove('active');
    App.editingTaskId = null;
  },

  openCategoryPanel() {
    this.renderCategoryList();
    document.getElementById('categoryModal').classList.add('active');
  },

  closeCategoryPanel() {
    document.getElementById('categoryModal').classList.remove('active');
  },

  renderCategoryList() {
    const list = document.getElementById('categoryList');
    if (App.categories.length === 0) {
      list.innerHTML = '<p style="color:var(--text-light);font-size:14px;">カテゴリはまだありません</p>';
      return;
    }
    list.innerHTML = App.categories.map((c, i) => `
      <div class="category-row">
        <input type="text" value="${App.esc(c)}" onchange="App.updateCategory(${i}, this.value)">
        <button class="category-delete" onclick="App.deleteCategory(${i})">×</button>
      </div>
    `).join('');
  },

  openGcalDetail(eventId) {
    const events = Storage.loadGcalEvents();
    const event = events.find(e => e.id === eventId);
    if (!event) return;
    const body = document.getElementById('gcalDetailBody');
    let timeStr;
    if (event.isAllDay) {
      timeStr = '終日';
    } else {
      const s = new Date(event.start);
      const e2 = new Date(event.end);
      timeStr = `${s.getHours()}:${String(s.getMinutes()).padStart(2,'0')} 〜 ${e2.getHours()}:${String(e2.getMinutes()).padStart(2,'0')}`;
    }
    const dateStr = event.start.includes('T') ? event.start.split('T')[0] : event.start;
    body.innerHTML = `
      <div class="gcal-detail-row"><div class="label">タイトル</div><div class="value">${App.esc(event.title)}</div></div>
      <div class="gcal-detail-row"><div class="label">日時</div><div class="value">${DeadlineHelper.formatDateFull(dateStr)} ${timeStr}</div></div>
      ${event.location ? `<div class="gcal-detail-row"><div class="label">場所</div><div class="value">${App.esc(event.location)}</div></div>` : ''}
      ${event.description ? `<div class="gcal-detail-row"><div class="label">説明</div><div class="value" style="white-space:pre-wrap;">${App.esc(event.description)}</div></div>` : ''}
      <button class="btn btn-primary" style="margin-top:16px;width:100%;" onclick="App.gcalToTask('${App.esc(event.id)}');UI.closeGcalDetail();">+ タスクに追加</button>
    `;
    document.getElementById('gcalDetailModal').classList.add('active');
  },

  closeGcalDetail() {
    document.getElementById('gcalDetailModal').classList.remove('active');
  },

  setPriority(val) {
    document.querySelectorAll('.priority-option').forEach(b => b.classList.toggle('selected', b.dataset.value === val));
  },

  setRecurring(type) {
    document.querySelectorAll('.recurring-option[data-rec]').forEach(b => b.classList.toggle('selected', b.dataset.rec === type));
    document.getElementById('recurringWeekly').style.display = type === 'weekly' ? '' : 'none';
    document.getElementById('recurringMonthly').style.display = type === 'monthly' ? '' : 'none';
  },

  setDow(dow) {
    document.querySelectorAll('.dow-btn').forEach(b => b.classList.toggle('selected', parseInt(b.dataset.dow) === dow));
  },

  toggleFilter() {
    const controls = document.getElementById('filterControls');
    controls.classList.toggle('open');
  },

  toggleCompleted() {
    const list = document.getElementById('completedList');
    const arrow = document.getElementById('completedArrow');
    const isOpen = list.style.display !== 'none';
    list.style.display = isOpen ? 'none' : '';
    arrow.classList.toggle('open', !isOpen);
  },

  showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }
};

/* ===== Init ===== */
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
